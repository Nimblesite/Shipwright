# Keeps SHA-pinned GitHub Actions (SWR-SEC-ACTION-PINNING) and lockfiles
# (SWR-SEC-FROZEN-INSTALL) fresh so immutable pins do not rot into stale,
# vulnerable dependencies. See docs/specs/supply-chain-security.md.
# templates/gh-actions/dependabot.yml is the copy shipped to downstream products.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # npm lives in three independent trees: the root pnpm workspace ("/"
  # covers every clients/ts/* package), the standalone Eleventy site
  # (website/, own pnpm-lock.yaml), and the AJV validator
  # (tools/validate-manifest/, own package-lock.json). "/" alone never
  # touches the latter two, so their pins silently rot — list all three.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/website"
      - "/tools/validate-manifest"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 5
