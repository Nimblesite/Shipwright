# agent-pmo:b636503
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # Dependabot PRs are swept into `dependabot-upgrades` and never merge into
    # main directly, so the heavy matrix would only burn minutes on a bump we
    # discard. CI runs once, on the consolidation PR. (SWR-SEC-DEPENDABOT-STAGING)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '9.x'

      - uses: dart-lang/setup-dart@v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-llvm-cov

      - name: Lint
        run: make lint

      - name: Deslop duplication gate
        env:
          DESLOP_VERSION: "0.5.1"
        run: |
          curl -sSfL "https://github.com/Nimblesite/Deslop/releases/download/v${DESLOP_VERSION}/deslop-${DESLOP_VERSION}-linux-x64.tar.gz" | tar -xz
          # $GITHUB_PATH only takes effect in *later* steps, so add the binary dir to
          # PATH for this step explicitly before invoking the gate in the same step.
          export PATH="$PWD/deslop-${DESLOP_VERSION}-linux-x64:$PATH"
          deslop .

      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/
          retention-days: 7

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: |
            target/release/
          retention-days: 7

  ts-tests:
    name: TypeScript tests (${{ matrix.os }})
    # Skip Dependabot bumps — swept into `dependabot-upgrades`, tested once on
    # the consolidation PR. (SWR-SEC-DEPENDABOT-STAGING)
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core build

      - name: Test shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core test

      - name: Build shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode build

      - name: Test shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode test

      - name: Test shipwright-mcp
        run: pnpm --filter @nimblesite/shipwright-mcp test

      - name: Install validate-manifest deps
        run: npm install --no-audit --no-fund
        working-directory: tools/validate-manifest

      - name: Test fixtures
        run: node --test tests/fixtures.test.mjs
