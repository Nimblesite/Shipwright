# agent-pmo:f481f8d
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2
        with:
          tool: cargo-llvm-cov

      - name: Format check
        run: make fmt CHECK=1

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/
          retention-days: 7

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: |
            target/release/
          retention-days: 7

  ts-tests:
    name: TypeScript tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core build

      - name: Test shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core test

      - name: Build shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode build

      - name: Test shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode test

      - name: Test shipwright-mcp
        run: pnpm --filter @nimblesite/shipwright-mcp test

      - name: Install validate-manifest deps
        run: npm install --no-audit --no-fund
        working-directory: tools/validate-manifest

      - name: Test fixtures
        run: node --test tests/fixtures.test.mjs
