# agent-pmo:f481f8d
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Format check
        run: make fmt CHECK=1

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/
          retention-days: 7

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            target/release/
          retention-days: 7

  ts-tests:
    name: TypeScript tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core build

      - name: Test shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core test

      - name: Build shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode build

      - name: Test shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode test

      - name: Test shipwright-mcp
        run: pnpm --filter @nimblesite/shipwright-mcp test

      - name: Install validate-manifest deps
        run: npm install --no-audit --no-fund
        working-directory: tools/validate-manifest

      - name: Test fixtures
        run: node --test tests/fixtures.test.mjs
