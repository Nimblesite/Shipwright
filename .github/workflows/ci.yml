# agent-pmo:b636503
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '9.x'

      - uses: dart-lang/setup-dart@v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2
        with:
          tool: cargo-llvm-cov

      - name: Lint
        run: make lint

      - name: Deslop duplication gate
        env:
          DESLOP_VERSION: "0.5.1"
        run: |
          curl -sSfL "https://github.com/Nimblesite/Deslop/releases/download/v${DESLOP_VERSION}/deslop-${DESLOP_VERSION}-linux-x64.tar.gz" | tar -xz
          # $GITHUB_PATH only takes effect in *later* steps, so add the binary dir to
          # PATH for this step explicitly before invoking the gate in the same step.
          export PATH="$PWD/deslop-${DESLOP_VERSION}-linux-x64:$PATH"
          deslop .

      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/
          retention-days: 7

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: |
            target/release/
          retention-days: 7

  ts-tests:
    name: TypeScript tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core build

      - name: Test shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core test

      - name: Build shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode build

      - name: Test shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode test

      - name: Test shipwright-mcp
        run: pnpm --filter @nimblesite/shipwright-mcp test

      - name: Install validate-manifest deps
        run: npm install --no-audit --no-fund
        working-directory: tools/validate-manifest

      - name: Test fixtures
        run: node --test tests/fixtures.test.mjs
