# agent-pmo:f481f8d
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2
        with:
          tool: cargo-llvm-cov

      - name: Format check
        run: make fmt CHECK=1

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/
          retention-days: 7

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts
          path: |
            target/release/
          retention-days: 7

  ts-tests:
    name: TypeScript tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core build

      - name: Test shipwright-core
        run: pnpm --filter @nimblesite/shipwright-core test

      - name: Build shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode build

      - name: Test shipwright-vscode
        run: pnpm --filter @nimblesite/shipwright-vscode test

      - name: Test shipwright-mcp
        run: pnpm --filter @nimblesite/shipwright-mcp test

      - name: Install validate-manifest deps
        run: npm install --no-audit --no-fund
        working-directory: tools/validate-manifest

      - name: Test fixtures
        run: node --test tests/fixtures.test.mjs
