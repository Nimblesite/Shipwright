# agent-pmo:b636503
# Reusable Rust release orchestrator.
#
# Product repos invoke this on tag push. The workflow stamps the release
# version when the product repo carries tools/shipwright-version-stamp,
# builds platform archives, publishes them to the GitHub Release, runs the
# shipwright smoke workflow, and optionally updates Homebrew/Scoop metadata.

name: shipwright release (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (v1.2.3 or 1.2.3)."
        type: string
        required: true
      bin_name:
        description: "Binary name as produced by cargo (argv[0])."
        type: string
        required: true
      crate_name:
        description: "Cargo package name (defaults to bin_name)."
        type: string
        required: false
        default: ""
      product_id:
        description: "Product id from shipwright.json (kebab-case)."
        type: string
        required: true
      manifest_path:
        description: "Path to shipwright.json in the product repo."
        type: string
        required: false
        default: "shipwright.json"
      targets:
        description: "JSON array of Rust target triples to build."
        type: string
        required: false
        default: '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-apple-darwin","aarch64-apple-darwin","x86_64-pc-windows-msvc"]'
      artifact_prefix:
        description: "Release asset prefix (defaults to bin_name)."
        type: string
        required: false
        default: ""
      tap_repo:
        description: "owner/repo for the Homebrew tap."
        type: string
        required: false
        default: ""
      formula_name:
        description: "Formula filename without extension (defaults to bin_name)."
        type: string
        required: false
        default: ""
      bucket_repo:
        description: "owner/repo for the Scoop bucket."
        type: string
        required: false
        default: ""
      manifest_name:
        description: "Scoop manifest filename without extension (defaults to bin_name)."
        type: string
        required: false
        default: ""
      homepage:
        description: "Homepage written to package-manager metadata."
        type: string
        required: false
        default: ""
      description:
        description: "Description written to package-manager metadata."
        type: string
        required: false
        default: ""
      publish_vsix:
        description: "When true, the smoke leg runs a VSIX activation check."
        type: boolean
        required: false
        default: false
      vsix_path:
        description: "Glob or relative path for the built VSIX (required if publish_vsix)."
        type: string
        required: false
        default: ""
    secrets:
      publish_token:
        description: "Token authorized to publish releases and package-manager repos."
        required: false

concurrency:
  group: shipwright-release-${{ github.ref }}
  cancel-in-progress: false

# SWR-SEC-TOKEN-PRIVILEGE: default read; only release-assets opts up to write.
# stamp/target-matrix/build only produce artifacts; publish-brew/scoop push to
# EXTERNAL repos with publish_token and only need read on this repo.
permissions:
  contents: read

jobs:
  stamp:
    name: stamp versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - id: normalize
        name: Normalize tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install stable toolchain
        if: hashFiles('tools/shipwright-version-stamp/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Stamp product versions
        if: hashFiles('tools/shipwright-version-stamp/Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path tools/shipwright-version-stamp/Cargo.toml -- --tag "${{ inputs.tag }}" --root .

      - name: Upload build-info
        if: hashFiles('build-info.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-info
          path: build-info.json

  target-matrix:
    name: plan release targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          definitions = {
              "aarch64-apple-darwin": {
                  "platform": "darwin-arm64",
                  "rust_target": "aarch64-apple-darwin",
                  "os": "macos-15",
                  "cross": False,
              },
              "x86_64-apple-darwin": {
                  "platform": "darwin-x64",
                  "rust_target": "x86_64-apple-darwin",
                  "os": "macos-13",
                  "cross": False,
              },
              "x86_64-unknown-linux-gnu": {
                  "platform": "linux-x64",
                  "rust_target": "x86_64-unknown-linux-gnu",
                  "os": "ubuntu-latest",
                  "cross": False,
              },
              "aarch64-unknown-linux-gnu": {
                  "platform": "linux-arm64",
                  "rust_target": "aarch64-unknown-linux-gnu",
                  "os": "ubuntu-latest",
                  "cross": True,
              },
              "x86_64-pc-windows-msvc": {
                  "platform": "win32-x64",
                  "rust_target": "x86_64-pc-windows-msvc",
                  "os": "windows-latest",
                  "cross": False,
              },
          }
          requested = json.loads(os.environ["TARGETS"])
          missing = [target for target in requested if target not in definitions]
          if missing:
              raise SystemExit(f"unsupported release targets: {', '.join(missing)}")
          include = [definitions[target] for target in requested]
          if not include:
              raise SystemExit("at least one release target is required")
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matrix={matrix}", file=output)
          PY

  build:
    name: build ${{ matrix.platform }}
    needs: [stamp, target-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.target-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # TIMEOUT EXCEPTION: Cross-platform Rust release builds may install targets,
    # validate manifests, compile release binaries, and package archives.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('tools/validate-manifest/package.json') != ''
        with:
          node-version: 24
          cache-dependency-path: tools/validate-manifest/package-lock.json

      - name: Install manifest validator deps
        if: hashFiles('tools/validate-manifest/package.json') != ''
        working-directory: tools/validate-manifest
        run: npm ci   # SWR-SEC-FROZEN-INSTALL

      - name: Validate deployment manifest
        if: hashFiles('tools/validate-manifest/index.mjs') != ''
        shell: bash
        run: node tools/validate-manifest/index.mjs "${{ inputs.manifest_path }}"

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          package="${{ inputs.crate_name }}"
          if [ -z "$package" ]; then package="${{ inputs.bin_name }}"; fi
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.rust_target }}" -p "$package" --bin "${{ inputs.bin_name }}"
          else
            cargo build --release --locked --target "${{ matrix.rust_target }}" -p "$package" --bin "${{ inputs.bin_name }}"
          fi

      - name: Verify binary version
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          bin="target/${{ matrix.rust_target }}/release/${{ inputs.bin_name }}${exe}"
          "$bin" --version | grep -Fx "${{ inputs.bin_name }} ${{ needs.stamp.outputs.version }}"

      - name: Package archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ inputs.artifact_prefix }}"
          if [ -z "$prefix" ]; then prefix="${{ inputs.bin_name }}"; fi
          stage="${prefix}-${{ needs.stamp.outputs.version }}-${{ matrix.platform }}"
          mkdir -p dist
          tar -czf "dist/$stage.tar.gz" -C "target/${{ matrix.rust_target }}/release" "${{ inputs.bin_name }}"
          shasum -a 256 "dist/$stage.tar.gz" | awk '{print $1"  "$2}' | sed "s|dist/||" > "dist/$stage.tar.gz.sha256"

      - name: Package archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = '${{ inputs.artifact_prefix }}'
          if ($prefix -eq '') { $prefix = '${{ inputs.bin_name }}' }
          $stage = "$prefix-${{ needs.stamp.outputs.version }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "target/${{ matrix.rust_target }}/release/${{ inputs.bin_name }}.exe" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$stage.zip").Hash.ToLower()
          "$hash  $stage.zip" | Out-File -FilePath "dist/$stage.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.bin_name }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release-assets:
    name: publish release assets
    needs: [stamp, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # SWR-SEC-TOKEN-PRIVILEGE: only this job creates the Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: ${{ inputs.bin_name }}-*
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*

  smoke:
    name: smoke
    needs: [stamp, release-assets]
    uses: ./.github/workflows/smoke.reusable.yml
    with:
      tag: ${{ inputs.tag }}
      bin_name: ${{ inputs.bin_name }}
      product_id: ${{ inputs.product_id }}
      publish_vsix: ${{ inputs.publish_vsix }}
      vsix_path: ${{ inputs.vsix_path }}

  publish-brew:
    name: publish brew tap
    if: inputs.tap_repo != ''
    needs: [stamp, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compute formula inputs
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="${{ inputs.artifact_prefix }}"
          if [ -z "$prefix" ]; then prefix="${{ inputs.bin_name }}"; fi
          version="${{ needs.stamp.outputs.version }}"
          asset="$prefix-$version-darwin-arm64.tar.gz"
          mkdir -p meta
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p "$asset.sha256" -D meta
          sha="$(awk '{print $1}' "meta/$asset.sha256")"
          homepage="${{ inputs.homepage }}"
          if [ -z "$homepage" ]; then homepage="https://github.com/${{ github.repository }}"; fi
          description="${{ inputs.description }}"
          if [ -z "$description" ]; then description="${{ inputs.bin_name }}"; fi
          {
            echo "asset_url=https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/$asset"
            echo "sha256=$sha"
            echo "homepage=$homepage"
            echo "description=$description"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tap_repo }}
          token: ${{ secrets.publish_token }}
          path: tap

      - name: Write formula
        shell: bash
        working-directory: tap
        run: |
          set -euo pipefail
          formula="${{ inputs.formula_name != '' && inputs.formula_name || inputs.bin_name }}"
          class_name="$(ruby -e 'puts ARGV[0].split(/[-_]/).map(&:capitalize).join' "$formula")"
          mkdir -p Formula
          cat > "Formula/$formula.rb" <<FORMULA
          class ${class_name} < Formula
            desc "${{ steps.meta.outputs.description }}"
            homepage "${{ steps.meta.outputs.homepage }}"
            url "${{ steps.meta.outputs.asset_url }}"
            version "${{ needs.stamp.outputs.version }}"
            sha256 "${{ steps.meta.outputs.sha256 }}"

            def install
              bin.install "${{ inputs.bin_name }}"
            end

            test do
              assert_match "${{ needs.stamp.outputs.version }}", shell_output("#{bin}/${{ inputs.bin_name }} --version")
            end
          end
          FORMULA

      - name: Commit formula
        shell: bash
        working-directory: tap
        run: |
          set -euo pipefail
          formula="${{ inputs.formula_name != '' && inputs.formula_name || inputs.bin_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/$formula.rb"
          git commit -m "Update $formula to ${{ needs.stamp.outputs.version }}" || exit 0
          git push

  publish-scoop:
    name: publish scoop bucket
    if: inputs.bucket_repo != ''
    needs: [stamp, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compute Scoop inputs
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="${{ inputs.artifact_prefix }}"
          if [ -z "$prefix" ]; then prefix="${{ inputs.bin_name }}"; fi
          version="${{ needs.stamp.outputs.version }}"
          asset="$prefix-$version-win32-x64.zip"
          mkdir -p meta
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p "$asset.sha256" -D meta
          sha="$(awk '{print $1}' "meta/$asset.sha256")"
          homepage="${{ inputs.homepage }}"
          if [ -z "$homepage" ]; then homepage="https://github.com/${{ github.repository }}"; fi
          description="${{ inputs.description }}"
          if [ -z "$description" ]; then description="${{ inputs.bin_name }}"; fi
          {
            echo "url=https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/$asset"
            echo "sha256=$sha"
            echo "homepage=$homepage"
            echo "description=$description"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.bucket_repo }}
          token: ${{ secrets.publish_token }}
          path: bucket-repo

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Write Scoop manifest
        working-directory: bucket-repo
        run: |
          node - <<'NODE'
          const { mkdirSync, writeFileSync } = require("node:fs");
          const manifest = {
            version: process.env.VERSION,
            description: process.env.DESCRIPTION,
            homepage: process.env.HOMEPAGE,
            license: "MIT",
            architecture: {
              "64bit": {
                url: process.env.URL,
                hash: process.env.SHA256
              }
            },
            bin: process.env.BIN
          };
          mkdirSync("bucket", { recursive: true });
          writeFileSync(`bucket/${process.env.MANIFEST_NAME}.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
        env:
          MANIFEST_NAME: ${{ inputs.manifest_name != '' && inputs.manifest_name || inputs.bin_name }}
          VERSION: ${{ needs.stamp.outputs.version }}
          URL: ${{ steps.meta.outputs.url }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          BIN: ${{ inputs.bin_name }}.exe
          HOMEPAGE: ${{ steps.meta.outputs.homepage }}
          DESCRIPTION: ${{ steps.meta.outputs.description }}

      - name: Commit manifest
        shell: bash
        working-directory: bucket-repo
        run: |
          set -euo pipefail
          manifest="${{ inputs.manifest_name != '' && inputs.manifest_name || inputs.bin_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bucket/$manifest.json"
          git commit -m "Update $manifest to ${{ needs.stamp.outputs.version }}" || exit 0
          git push
