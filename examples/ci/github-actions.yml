name: shipwright-contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Validate all golden manifests
        run: node tools/validate-manifest/index.mjs fixtures/manifests

  product-drift-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Product repo binary drift gate
        run: |
          echo "shipwright verify-binaries --manifest shipwright.json --platform linux-x64"
          echo "shipwright verify-extension-package --manifest shipwright.json --package product.vsix --platform linux-x64"
          echo "These commands must fail when an extension version and bundled binary version drift."
