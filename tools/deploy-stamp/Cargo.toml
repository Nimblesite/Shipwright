[package]
name = "deploy-stamp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI: stamp a semver tag into Cargo.toml, package.json, csproj, and pubspec.yaml before a release build."

[[bin]]
name = "deploy-stamp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
