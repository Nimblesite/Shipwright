# publish-vsix-per-platform.yml — Shipwright-shipped reusable workflow.
#
# Matrix structure and publish job follow the official Microsoft sample:
# https://github.com/microsoft/vscode-platform-specific-sample/blob/main/.github/workflows/ci.yml
# with the Shipwright supply-chain contract layered on top
# (docs/specs/supply-chain-security.md, docs/specs/vsix-platform-bundling.md):
#   - SWR-SEC-ACTION-PINNING  every `uses:` is a full 40-char commit SHA.
#   - SWR-SEC-TOKEN-PRIVILEGE top-level read; id-token/attestations job-scoped.
#   - SWR-SEC-FROZEN-INSTALL  npm ci (the sample uses npm install).
#   - SWR-VSIX-BUNDLE-VERIFY  record the staged binary digest for host re-verify.
#   - SWR-VSIX-PROVENANCE     attest the packaged .vsix (SLSA L2).
#   - SWR-SEC-OIDC-PUBLISH    Marketplace PAT runs in a protected environment.

name: publish-vsix-per-platform

on:
  workflow_call:
    inputs:
      manifest_path:
        required: false
        type: string
        default: shipwright.json
      extension_name:
        required: true
        type: string
      binary_name:
        required: true
        type: string
      version:
        required: true
        type: string
      build_command:
        required: true
        type: string
      pre_release:
        required: false
        type: boolean
        default: false
      marketplace_environment:
        description: "Protected GitHub Environment that gates the Marketplace publish (SWR-SEC-OIDC-PUBLISH)."
        required: false
        type: string
        default: release
    secrets:
      vsce_pat:
        required: true

# SWR-SEC-TOKEN-PRIVILEGE: default read-only; jobs opt up.
permissions:
  contents: read

jobs:
  build:
    # Matrix shape matches the official MS sample: platform + arch as separate
    # fields; target is constructed as "$platform-$arch" via pwsh.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            npm_config_arch: arm64
          - os: macos-latest
            platform: darwin
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            npm_config_arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
            npm_config_arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
            npm_config_arch: arm

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # SWR-VSIX-PROVENANCE: attest the packaged VSIX
      attestations: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # node-version: 22.x — from official MS sample ci.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      # SWR-SEC-FROZEN-INSTALL: npm ci (sample uses npm install). No GITHUB_TOKEN:
      # this template stages a built binary (Pattern B), so the install needs no token.
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.npm_config_arch }}

      - name: Validate deployment manifest
        shell: bash
        run: node tools/validate-manifest/index.mjs "${{ inputs.manifest_path }}"

      - name: Build binary
        shell: bash
        run: ${{ inputs.build_command }}

      - name: Verify binary version
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          "./target/release/${{ inputs.binary_name }}${exe}" --version | grep -Fx "${{ inputs.binary_name }} ${{ inputs.version }}"

      # Construct vsce target exactly as the official MS sample does.
      - name: Set vsce target
        shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV

      # SWR-VSIX-BUNDLE-VERIFY: record the digest of the binary being bundled so the
      # host can re-verify it at activation (shipwright.json bundled.checksum:true).
      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "bin/${{ env.target }}"
          cp "target/release/${{ inputs.binary_name }}${exe}" "bin/${{ env.target }}/"
          shasum -a 256 "bin/${{ env.target }}/${{ inputs.binary_name }}${exe}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package VSIX
        shell: bash
        run: |
          args="--target ${{ env.target }}"
          if [ "${{ inputs.pre_release }}" = "true" ]; then args="$args --pre-release"; fi
          npx vsce package $args

      - name: Verify VSIX contents
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          unzip -l *.vsix | grep -F "bin/${{ env.target }}/${{ inputs.binary_name }}${exe}"

      # SWR-VSIX-PROVENANCE: attest the final .vsix (each platform is a distinct subject).
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "*.vsix"

      # Artifact named "$target" (e.g. darwin-arm64) — from official MS sample ci.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.target }}
          path: "*.vsix"

  # Publish job follows the official MS sample. SWR-SEC-OIDC-PUBLISH: the long-lived
  # VSCE_PAT is gated behind a protected environment (required reviewers + tag rule).
  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.marketplace_environment }}
    permissions:
      contents: read
    if: success() && startsWith( github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      # find . -iname *.vsix — exact form from official MS sample (no quotes around glob)
      - name: Publish to VS Code Marketplace
        run: |
          args="--packagePath $(find . -iname *.vsix)"
          if [ "${{ inputs.pre_release }}" = "true" ]; then args="$args --pre-release"; fi
          npx vsce publish $args
        env:
          VSCE_PAT: ${{ secrets.vsce_pat }}
