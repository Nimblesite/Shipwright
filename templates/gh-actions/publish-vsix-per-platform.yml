# publish-vsix-per-platform.yml
#
# Reusable workflow for building and publishing platform-specific VSIXs.
# Matrix structure and publish job copied from the official Microsoft sample:
# https://github.com/microsoft/vscode-platform-specific-sample/blob/main/.github/workflows/ci.yml

name: publish-vsix-per-platform

on:
  workflow_call:
    inputs:
      manifest_path:
        required: false
        type: string
        default: shipwright.json
      extension_name:
        required: true
        type: string
      binary_name:
        required: true
        type: string
      version:
        required: true
        type: string
      build_command:
        required: true
        type: string
      pre_release:
        required: false
        type: boolean
        default: false
    secrets:
      vsce_pat:
        required: true

jobs:
  build:
    # Matrix shape matches official MS sample: platform + arch as separate fields.
    # target is constructed as "$platform-$arch" via pwsh, matching the sample exactly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            npm_config_arch: arm64
          - os: macos-latest
            platform: darwin
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            npm_config_arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
            npm_config_arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
            npm_config_arch: arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # node-version: 22.x — from official MS sample ci.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # npm_config_arch on the install step — from official MS sample ci.yml
      - name: Install dependencies
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_config_arch }}

      - name: Validate deployment manifest
        shell: bash
        run: node tools/validate-manifest/index.mjs "${{ inputs.manifest_path }}"

      - name: Build binary
        shell: bash
        run: ${{ inputs.build_command }}

      - name: Verify binary version
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          "./target/release/${{ inputs.binary_name }}${exe}" --version | grep -Fx "${{ inputs.binary_name }} ${{ inputs.version }}"

      # Construct vsce target exactly as the official MS sample does — pwsh writes to GITHUB_ENV
      - name: Set vsce target
        shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "bin/${{ env.target }}"
          cp "target/release/${{ inputs.binary_name }}${exe}" "bin/${{ env.target }}/"

      - name: Package VSIX
        shell: bash
        run: |
          args="--target ${{ env.target }}"
          if [ "${{ inputs.pre_release }}" = "true" ]; then args="$args --pre-release"; fi
          npx vsce package $args

      - name: Verify VSIX contents
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          unzip -l *.vsix | grep -F "bin/${{ env.target }}/${{ inputs.binary_name }}${exe}"

      # Artifact named "$target" (e.g. darwin-arm64) — from official MS sample ci.yml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.target }}
          path: "*.vsix"

  # Publish job copied from official MS sample ci.yml
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: success() && startsWith( github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      # find . -iname *.vsix — exact form from official MS sample (no quotes around glob)
      - name: Publish to VS Code Marketplace
        run: |
          args="--packagePath $(find . -iname *.vsix)"
          if [ "${{ inputs.pre_release }}" = "true" ]; then args="$args --pre-release"; fi
          npx vsce publish $args
        env:
          VSCE_PAT: ${{ secrets.vsce_pat }}
