name: release-binary-multiplatform

on:
  workflow_call:
    inputs:
      manifest_path:
        required: false
        type: string
        default: shipwright.json
      binary_name:
        required: true
        type: string
      version:
        required: true
        type: string
      build_command:
        required: true
        type: string
      artifact_prefix:
        required: false
        type: string
        default: ""
      upload_release:
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-15
          - platform: darwin-x64
            os: macos-13
          - platform: linux-x64
            os: ubuntu-latest
          - platform: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment manifest
        shell: bash
        run: node tools/validate-manifest/index.mjs "${{ inputs.manifest_path }}"
      - name: Build binary
        shell: bash
        run: ${{ inputs.build_command }}
      - name: Verify binary version
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          "./target/release/${{ inputs.binary_name }}${exe}" --version | grep -Fx "${{ inputs.binary_name }} ${{ inputs.version }}"
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ inputs.artifact_prefix }}"
          if [ -z "$prefix" ]; then prefix="${{ inputs.binary_name }}"; fi
          mkdir -p dist
          tar -czf "dist/${prefix}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz" -C target/release "${{ inputs.binary_name }}"
          shasum -a 256 "dist/${prefix}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz" > "dist/${prefix}-${{ inputs.version }}-${{ matrix.platform }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary_name }}-${{ matrix.platform }}
          path: dist/*

  publish:
    if: ${{ inputs.upload_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: dist/*
