name: publish-brew-tap

on:
  workflow_call:
    inputs:
      tap_repo:
        required: true
        type: string
      formula_name:
        required: true
        type: string
      version:
        required: true
        type: string
      asset_url:
        required: true
        type: string
      sha256:
        required: true
        type: string
      binary_name:
        required: true
        type: string
      homepage:
        required: true
        type: string
      description:
        required: true
        type: string
    secrets:
      tap_token:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tap_repo }}
          token: ${{ secrets.tap_token }}
          path: tap
      - name: Write formula
        shell: bash
        working-directory: tap
        run: |
          set -euo pipefail
          class_name="$(ruby -e 'puts ARGV[0].split(/[-_]/).map(&:capitalize).join' "${{ inputs.formula_name }}")"
          mkdir -p Formula
          cat > "Formula/${{ inputs.formula_name }}.rb" <<FORMULA
          class ${class_name} < Formula
            desc "${{ inputs.description }}"
            homepage "${{ inputs.homepage }}"
            url "${{ inputs.asset_url }}"
            version "${{ inputs.version }}"
            sha256 "${{ inputs.sha256 }}"

            def install
              bin.install "${{ inputs.binary_name }}"
            end

            test do
              assert_match "${{ inputs.version }}", shell_output("#{bin}/${{ inputs.binary_name }} --version")
            end
          end
          FORMULA
      - name: Commit formula
        shell: bash
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${{ inputs.formula_name }}.rb"
          git commit -m "Update ${{ inputs.formula_name }} to ${{ inputs.version }}" || exit 0
          git push
