[workspace]
resolver = "2"
members = [
    "crates/deploy-toolkit-host",
    "crates/deploy-toolkit-manifest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nimblesite/deployment_toolkit"
description = "Shared libraries for deploying binaries and IDE extensions with matching versions."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
