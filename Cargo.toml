[workspace]
resolver = "2"
members = [
    "crates/shipwright",
    "crates/shipwright-host",
    "crates/shipwright-manifest",
    "crates/shipwright-zed",
    "tools/shipwright-version-stamp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nimblesite/Shipwright"
homepage = "https://github.com/Nimblesite/Shipwright"
description = "Shared libraries for deploying binaries and IDE extensions with matching versions."
keywords = ["deployment", "versioning", "ide-extension", "binary", "tooling"]
categories = ["development-tools", "development-tools::build-utils"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# agent-pmo:f481f8d
# Workspace lints — deny-by-default. See REPO-STANDARDS-SPEC [LINT-RUST].
# Inherit in every member crate with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_imports = "deny"
dead_code = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_assignments = "deny"
unused_results = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
elided_lifetimes_in_paths = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
missing_docs_in_private_items = "deny"

# NOTE: `float_arithmetic = "deny"` is INTENTIONALLY NOT enabled here.
# See REPO-STANDARDS-SPEC [LINT-RUST] for rationale. If a specific crate needs
# bit-exact float-free arithmetic, add `#![deny(clippy::float_arithmetic)]` as
# a crate-level attribute inside that crate's root module.
